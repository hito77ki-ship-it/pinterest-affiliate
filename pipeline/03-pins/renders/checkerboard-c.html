<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Inter:wght@700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1000px; height:1500px; overflow:hidden; zoom:0.5; font-family:'Inter',sans-serif; }
.pin { width:1000px; height:1500px; position:relative; background: repeating-conic-gradient(#C0654A 0% 25%, #F2E9DD 0% 50%) 0 0 / 100px 100px; }
.bar { position:absolute; left:0; right:0; bottom:0; height:430px; background:rgba(70,30,20,0.82); border-top:5px solid #F2E9DD; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; }
.bar h1 { font-family:'Lora',serif; color:#fff; font-size:50px; text-align:center; line-height:1.25; margin-bottom:28px; }
.subrow { display:flex; gap:26px; }
.subrow span { color:#F2E9DD; font-weight:800; font-size:22px; letter-spacing:0.04em; border:2px solid #F2E9DD; border-radius:8px; padding:10px 18px; }
</style></head>
<body>
<div class="pin">
  <div class="bar">
    <h1>Colorful Checkerboard Tile,<br>No Demo Required</h1>
    <div class="subrow"><span>PEEL &amp; STICK</span><span>NO THINSET</span><span>REMOVABLE</span></div>
  </div>
</div>
</body></html>
