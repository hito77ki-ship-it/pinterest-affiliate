<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Inter:wght@700;800&display=swap');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1000px; height:1500px; overflow:hidden; zoom:0.5; font-family:'Inter',sans-serif; }
.pin { width:1000px; height:1500px; position:relative; background:linear-gradient(165deg,#8A3B4C,#3D1622 70%); display:flex; align-items:center; justify-content:center; }
.props { position:absolute; top:120px; left:0; right:0; display:flex; justify-content:center; gap:50px; }
.wreath { width:160px; height:160px; border-radius:50%; border:20px solid #C9A25A; }
.urn { width:110px; height:180px; background:#A9856B; border-radius:10px 10px 40px 40px; margin-top:60px; }
.bar { position:absolute; left:0; right:0; bottom:0; height:420px; background:rgba(30,10,15,0.75); border-top:5px solid #C9A25A; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; }
.bar h1 { font-family:'Lora',serif; color:#fff; font-size:52px; text-align:center; margin-bottom:26px; }
.subrow { display:flex; gap:22px; }
.subrow span { color:#F2E9DD; font-weight:800; font-size:22px; letter-spacing:0.03em; border:2px solid #C9A25A; border-radius:8px; padding:10px 16px; }
</style></head>
<body>
<div class="pin">
  <div class="props"><div class="wreath"></div><div class="urn"></div></div>
  <div class="bar">
    <h1>No-Drill Fall Porch,<br>Under $210</h1>
    <div class="subrow"><span>4x6 FT</span><span>7 PIECES</span><span>UNDER $210</span></div>
  </div>
</div>
</body></html>
